            Manage your store, orders and growth in one place

          <div class="flex gap-[5px] pl-[93px]">
            <img
              src="img/Rectangle 20.png"
              alt=""

            © 2025 Errandly All rights reserved.
          </p>
        </div>

        <div class="w-[773px] pt-[61.75px] font-bold text-[48px] pl-[75px]">
          <h1 class="pb-[16px] leading-[56px] tracking-normal">

          <p
            class="font-normal text-[18px] leading-[100%] tracking-normal pb-[60.5px]"

            Create your vendor account here
          </p>

          <div>
            <form action="">
              <div>
                <label for="fullname" class="text-sm font-normal"

                <input
                  type="text"

                  class="block w-[632px] pt-[14px] pb-[10px] border border-gray-300 bg-gray-50 focus:outline-none text-sm rounded-[2px] font-medium text-[16px] leading-[24px] tracking-normal pl-[16px]"
                />
                <label for="email" class="text-sm font-normal"
                  >Email Address</label
                >
                <input
                  type="text"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  class="block w-[632px] pt-[14px] pb-[10px] border border-gray-300 bg-gray-50 focus:outline-none text-sm rounded-[2px] font-medium text-[16px] leading-[24px] tracking-normal pl-[16px]"
                />
                <label for="phone" class="text-sm font-normal"
                  >Phone Number</label
                >
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                  class="block w-[632px] pt-[14px] pb-[10px] border border-gray-300 bg-gray-50 focus:outline-none text-sm rounded-[2px] font-medium text-[16px] leading-[24px] tracking-normal pl-[16px]"
                />
                <label for="password" class="text-sm font-normal"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  class="block w-[632px] pt-[14px] pb-[10px] border border-gray-300 bg-gray-50 focus:outline-none text-sm rounded-[2px] font-medium text-[16px] leading-[24px] tracking-normal pl-[16px]"
                />
                <label for="password" class="text-sm font-normal"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Re-enter password here"
                  class="block w-[632px] pt-[14px] pb-[10px] border border-gray-300 bg-gray-50 focus:outline-none text-sm rounded-[2px] font-medium text-[16px] leading-[24px] tracking-normal pl-[16px]"
                />
              </div>
            </form>
          </div>
